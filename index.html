<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Product cards</title><link rel=stylesheet href=layout_product-cards.a69d2747.css><link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel=stylesheet><body>
    <div class=card data-qa=card>
      <img class=card__image src=imac.202c52ff.jpeg alt="Apple iMac">

      <div class=card__title>
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </div>
      <p class=card__code>Product code: 195434</p>
      <div class=card__rating>
        <div class="stars stars--4">
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
          <div class=stars__star></div>
        </div>
        <div class=card__reviews>Reviews: 5</div>
      </div>

      <div class=card__price>
        <div class=card__price-label>Price:</div>
        <div class=card__price-value>$2,199</div>
      </div>

      <a href=# class=card__buy data-qa=hover>
        Buy
      </a>
    </div>
